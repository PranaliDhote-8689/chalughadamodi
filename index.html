<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only" />
  <title>स्पर्धा परीक्षा चालू घडामोडी — लवकरच आपल्या सेवेत</title>
  <link rel="icon" type="image/png" href="myphoto.png" />

  <!-- Social Media Share Preview (Open Graph) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://chalughadamodi.com/" />
  <meta property="og:title" content="स्पर्धा परीक्षा चालू घडामोडी — लवकरच आपल्या सेवेत" />
  <meta property="og:description" content="स्पर्धा परीक्षांसाठी दैनिक चालू घडामोडी व सराव संच. संकल्प स्पर्धा परीक्षेचा!" />
  <meta property="og:image" content="https://chalughadamodi.com/myphoto.png" />
  <meta property="og:image:alt" content="स्पर्धा परीक्षा चालू घडामोडी लोगो" />

  <!-- Twitter / Link Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="स्पर्धा परीक्षा चालू घडामोडी — लवकरच आपल्या सेवेत" />
  <meta name="twitter:description" content="स्पर्धा परीक्षांसाठी दैनिक चालू घडामोडी व सराव संच." />
  <meta name="twitter:image" content="https://chalughadamodi.com/myphoto.png" />

  <style>
    :root {
      color-scheme: light only;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Noto Sans Devanagari", "Nirmala UI", system-ui, -apple-system, sans-serif;
      background-color: #f7ecd6;
      color: #23160a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
      text-align: center;
    }

    .header-box {
      width: 100%;
      max-width: 920px;
      background-color: #fdf6e7;
      border: 1.5px solid #dec192;
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(43, 29, 14, 0.11);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
    }

    .logo-box {
      width: clamp(54px, 11vw, 76px);
      height: clamp(54px, 11vw, 76px);
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(43, 29, 14, 0.25);
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .main-title {
      font-size: clamp(1.1rem, 3.5vw, 2.35rem);
      font-weight: 800;
      color: #1f1308;
      line-height: 1.2;
    }

    .sub-title {
      font-size: clamp(0.76rem, 1.8vw, 1.15rem);
      font-weight: 600;
      color: #9e4f0e;
      margin-top: 4px;
    }

    .pill-tag {
      background: linear-gradient(90deg, #e86f1c, #c94e06);
      color: #ffffff;
      font-weight: 700;
      font-size: clamp(0.78rem, 1.8vw, 1.15rem);
      padding: 10px 18px;
      border-radius: 10px;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(201, 78, 6, 0.3);
    }

    .launch-message {
      margin-top: 42px;
      font-size: clamp(2rem, 6.5vw, 4.2rem);
      font-weight: 900;
      color: #a84905;
      line-height: 1.25;
      letter-spacing: 0.5px;
    }

    @media (max-width: 520px) {
      .header-box {
        padding: 14px 12px;
        gap: 10px;
      }

      .brand-left {
        gap: 10px;
      }

      .pill-tag {
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <header class="header-box">
    <div class="brand-left">
      <div class="logo-box">
        <img src="myphoto.png" alt="स्पर्धा परीक्षा चालू घडामोडी लोगो" width="152" height="152" decoding="async" />
      </div>
      <div>
        <div class="main-title">स्पर्धा परीक्षा चालू घडामोडी</div>
        <div class="sub-title">स्पर्धा परीक्षांसाठी दैनिक चालू घडामोडी व सराव संच</div>
      </div>
    </div>
    <div class="pill-tag">🎯 संकल्प स्पर्धा परीक्षेचा!</div>
  </header>

  <main class="launch-message">
    लवकरच आपल्या सेवेत
  </main>
</body>
</html>
